# Builds the frontend and deploys it to Firebase Hosting (project clearskyhere):
# pushes to main go live; pull requests get a temporary preview URL, posted on the PR.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/firebase-hosting.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    # Forks get no secrets: skip their pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          # The production backend (already public in the shipped bundle).
          VITE_BACKEND_URL: https://portfolio-backend-hhn7.onrender.com

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLEARSKYHERE }}
          projectId: clearskyhere
          entryPoint: frontend
          # main deploys live; a pull request gets its own preview channel (the URL is posted on the PR);
          # a manual run on any other branch gets a preview channel too, never live.
          channelId: ${{ github.ref == 'refs/heads/main' && 'live' || (github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || format('manual{0}', github.run_number)) }}
